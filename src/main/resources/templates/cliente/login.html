<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login do Cliente</title>
<link rel="stylesheet" th:href="@{/css/login/login.css}">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        
        <form action="#" th:action="@{/cliente/login}" method="post">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" 
                       placeholder="Digite seu email" required />
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" 
                       placeholder="Digite sua senha" required />
            </div>
            
            <button type="submit">Entrar</button>
        </form>
        
        <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>
        <div th:if="${mensagemErro}" class="mensagem-erro" th:text="${mensagemErro}"></div>
        
        <div class="link-cadastro">
            <p>Ainda não possui cadastro? <a th:href="@{/cliente/registrar}">Cadastre-se aqui</a></p>
        </div>
    </div>
</body>
</html>
